name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#C9A24A&color_dots=#ebedf0,#f3e3b5,#e2c46f,#c9a24a,#8a6a24
            dist/snake-dark.svg?palette=github-dark&color_snake=#E8C872&color_dots=#161b22,#4d3d15,#7a5f22,#b08a3a,#e8c872

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
